name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # O google-services.json real fica fora do git. Use o secret GOOGLE_SERVICES_JSON
      # (conteúdo do arquivo) se existir; senão, um placeholder só para compilar.
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cp .github/ci/google-services.placeholder.json app/google-services.json
          fi

      - name: Testes unitários
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Build debug
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Build release (R8)
        run: ./gradlew --stacktrace :app:assembleRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
